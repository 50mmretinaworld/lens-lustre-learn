# READ ONLY. Two autopsies from Supabase's own logs (Owner bug list 28 Nov):
#   item 15 — "log data why so high?" (free plan includes 1 GB a month; 1.18 GB used): lines per log source,
#             busiest request paths, edge functions and database message kinds;
#   item 10 — the database refused new connections on 27 Nov 12:12–13:02 IST (06:42–07:32 UTC): the database's
#             warnings / errors in a chosen window (e.g. "too many connections").
# Prints counts, paths and the first words of messages only: no query strings, no headers, digits masked,
# anything that looks like a credential skipped. If the logs API refuses, its own error text is printed.
name: Log volume (read-only)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "staging = fpszggreishhuvdpkmdr, production = jtdtehuqtinjxropkkcn"
        required: true
        type: choice
        options: [staging, production]
      hours:
        description: "Window: how many hours back from now (1-23). Ignored when start_utc is set."
        required: false
        default: "12"
      start_utc:
        description: "Optional window start, UTC, e.g. 2026-11-27T06:30:00Z"
        required: false
        default: ""
      end_utc:
        description: "Optional window end, UTC (with start_utc), at most 23 hours after it"
        required: false
        default: ""

concurrency:
  group: logs-volume-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  count:
    name: log volume on ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      TARGET_LANE: ${{ inputs.target }}
      BRANCH_REF: ${{ github.ref }}
      HOURS: ${{ inputs.hours }}
      START_UTC: ${{ inputs.start_utc }}
      END_UTC: ${{ inputs.end_utc }}
    steps:
      - name: The branch must match the target, and the ref is fixed by it
        run: |
          set -euo pipefail
          case "$TARGET_LANE" in
            production) WANT=refs/heads/main;    REF=jtdtehuqtinjxropkkcn ;;
            staging)    WANT=refs/heads/staging; REF=fpszggreishhuvdpkmdr ;;
            *) echo "::error::Unknown target '$TARGET_LANE'."; exit 1 ;;
          esac
          if [ "$BRANCH_REF" != "$WANT" ]; then
            echo "::error::target='$TARGET_LANE' must be dispatched from '$WANT', not '$BRANCH_REF'. Refusing."
            exit 1
          fi
          stamp='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          if [ -n "$START_UTC" ]; then
            [[ "$START_UTC" =~ $stamp ]] || { echo "::error::start_utc must look like 2026-11-27T06:30:00Z"; exit 1; }
            [[ "$END_UTC" =~ $stamp ]] || { echo "::error::end_utc must look like 2026-11-27T07:40:00Z"; exit 1; }
            S=$(date -u -d "$START_UTC" +%s); E=$(date -u -d "$END_UTC" +%s)
            if [ "$E" -le "$S" ] || [ $((E - S)) -gt 82800 ]; then echo "::error::window must be 1 s to 23 h"; exit 1; fi
            echo "WIN_START=$START_UTC" >> "$GITHUB_ENV"; echo "WIN_END=$END_UTC" >> "$GITHUB_ENV"
          else
            case "$HOURS" in ''|*[!0-9]*) echo "::error::hours must be a number"; exit 1 ;; esac
            if [ "$HOURS" -lt 1 ] || [ "$HOURS" -gt 23 ]; then echo "::error::hours must be 1-23"; exit 1; fi
            echo "WIN_START=$(date -u -d "-$HOURS hours" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
            echo "WIN_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          fi
          echo "PROJECT_REF=$REF" >> "$GITHUB_ENV"

      - name: Read the logs (read only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set."; exit 1; }
          echo "Window (UTC): $WIN_START .. $WIN_END"
          # q SQL → writes /tmp/out.json; prints the API's own error (trimmed) when it refuses.
          # Supabase removed .../logs.all (HTTP 410, 28 Nov): the address is .../analytics/endpoints/logs.
          # The API also throttles (HTTP 429): one question every 6 s, and one retry after 30 s when refused.
          q() {
            local try
            for try in 1 2; do
              sleep 6
              code=$(curl -sS -G -o /tmp/out.json -w '%{http_code}' -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/analytics/endpoints/logs" \
                --data-urlencode "sql=$1" --data-urlencode "iso_timestamp_start=$WIN_START" --data-urlencode "iso_timestamp_end=$WIN_END")
              [ "$code" = "429" ] && [ "$try" = "1" ] && { sleep 30; continue; }
              break
            done
            if [ "$code" != "200" ] || [ "$(jq -r 'has("error") and .error != null' /tmp/out.json 2>/dev/null)" = "true" ]; then
              echo "  (logs API answered HTTP $code: $(jq -c '.error // .message // .' /tmp/out.json 2>/dev/null | cut -c1-300))"
              return 1
            fi
            return 0
          }
          # ClickHouse SQL over ONE table `logs` (source_name says which part wrote the line; nested fields are in the
          # log_attributes map). Supabase changelog 48235.
          SECRET="password|secret|token|apikey|api_key|jwt|bearer|key="
          echo "== A · lines and size per log source (size = message + attributes, in MB)"
          q "SELECT source_name AS s, count() AS n, round(sum(length(event_message) + length(toString(log_attributes))) / 1048576, 1) AS mb FROM logs GROUP BY s ORDER BY mb DESC" \
            && jq -r '.result[]? | "  \(.s)\t\(.n) lines\t\(.mb) MB"' /tmp/out.json
          echo "== B · busiest API paths (edge_logs, query strings dropped, ids masked)"
          q "SELECT replaceRegexpAll(log_attributes['request.path'], '[0-9a-f-]{8,}|[0-9]+', ':id') AS p, log_attributes['request.method'] AS m, count() AS n FROM logs WHERE source_name = 'edge_logs' GROUP BY p, m ORDER BY n DESC LIMIT 30" \
            && jq -r '.result[]? | "  \(.n)\t\(.m) \(.p)"' /tmp/out.json
          echo "== C · busiest edge functions"
          q "SELECT replaceRegexpAll(log_attributes['request.pathname'], '[0-9a-f-]{8,}|[0-9]+', ':id') AS p, count() AS n FROM logs WHERE source_name = 'function_edge_logs' GROUP BY p ORDER BY n DESC LIMIT 15" \
            && jq -r '.result[]? | "  \(.n)\t\(.p)"' /tmp/out.json
          echo "== D · database log message kinds (first 60 letters, digits masked)"
          q "SELECT replaceRegexpAll(substring(event_message, 1, 60), '[0-9]+', '#') AS k, count() AS n FROM logs WHERE source_name = 'postgres_logs' AND NOT match(lower(event_message), '$SECRET') GROUP BY k ORDER BY n DESC LIMIT 25" \
            && jq -r '.result[]? | "  \(.n)\t\(.k)"' /tmp/out.json
          echo "== E · database problems per minute (first 90 letters, digits masked)"
          q "SELECT formatDateTime(timestamp, '%m-%d %H:%i') AS at, replaceRegexpAll(substring(event_message, 1, 90), '[0-9]+', '#') AS k, count() AS n FROM logs WHERE source_name = 'postgres_logs' AND match(lower(event_message), 'fatal|error|too many|remaining connection|timeout|terminat|could not|out of|deadlock|checkpoint') AND NOT match(lower(event_message), '$SECRET') GROUP BY at, k ORDER BY at LIMIT 80" \
            && jq -r '.result[]? | "  \(.at) UTC x\(.n)\t\(.k)"' /tmp/out.json
          echo "== F · connection pooler problems per minute (supavisor, first 90 letters)"
          q "SELECT formatDateTime(timestamp, '%m-%d %H:%i') AS at, replaceRegexpAll(substring(event_message, 1, 90), '[0-9]+', '#') AS k, count() AS n FROM logs WHERE source_name = 'supavisor_logs' AND match(lower(event_message), 'error|timeout|max|limit|refus|too many') AND NOT match(lower(event_message), '$SECRET') GROUP BY at, k ORDER BY at LIMIT 40" \
            && jq -r '.result[]? | "  \(.at) UTC x\(.n)\t\(.k)"' /tmp/out.json
          echo "== G · lines per 10 minutes, all sources (spikes)"
          q "SELECT formatDateTime(toStartOfTenMinutes(timestamp), '%m-%d %H:%i') AS at, count() AS n FROM logs GROUP BY at ORDER BY at LIMIT 150" \
            && jq -r '.result[]? | "  \(.at) UTC\t\(.n)"' /tmp/out.json
          echo "Read only: nothing was changed."
