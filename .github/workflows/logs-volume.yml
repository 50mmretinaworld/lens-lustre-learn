# READ ONLY. Which part of the project writes the most LOG lines (Owner 28 Nov: "log data why so high?" —
# Supabase free plan includes 1 GB of logs a month; 1.18 GB used). Counts lines per log source for the last
# 24 hours, then the busiest request paths, edge functions and database message kinds. Prints counts and
# paths only: no query strings, no headers, digits masked, anything that looks like a credential skipped.
name: Log volume (read-only)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "staging = fpszggreishhuvdpkmdr, production = jtdtehuqtinjxropkkcn"
        required: true
        type: choice
        options: [staging, production]
      hours:
        description: "How many hours back (1-24)"
        required: false
        default: "24"

concurrency:
  group: logs-volume-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  count:
    name: log volume on ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target }}
    env:
      TARGET_LANE: ${{ inputs.target }}
      BRANCH_REF: ${{ github.ref }}
      HOURS: ${{ inputs.hours }}
    steps:
      - name: The branch must match the target, and the ref is fixed by it
        run: |
          set -euo pipefail
          case "$TARGET_LANE" in
            production) WANT=refs/heads/main;    REF=jtdtehuqtinjxropkkcn ;;
            staging)    WANT=refs/heads/staging; REF=fpszggreishhuvdpkmdr ;;
            *) echo "::error::Unknown target '$TARGET_LANE'."; exit 1 ;;
          esac
          if [ "$BRANCH_REF" != "$WANT" ]; then
            echo "::error::target='$TARGET_LANE' must be dispatched from '$WANT', not '$BRANCH_REF'. Refusing."
            exit 1
          fi
          case "$HOURS" in ''|*[!0-9]*) echo "::error::hours must be a number"; exit 1 ;; esac
          if [ "$HOURS" -lt 1 ] || [ "$HOURS" -gt 24 ]; then echo "::error::hours must be 1-24"; exit 1; fi
          echo "PROJECT_REF=$REF" >> "$GITHUB_ENV"

      - name: Count log lines (read only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set."; exit 1; }
          END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          START=$(date -u -d "-$HOURS hours" +%Y-%m-%dT%H:%M:%SZ)
          echo "Window (UTC): $START .. $END"
          q() {
            curl -sS -G -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/analytics/endpoints/logs.all" \
              --data-urlencode "sql=$1" --data-urlencode "iso_timestamp_start=$START" --data-urlencode "iso_timestamp_end=$END"
          }
          echo "== A · lines per log source"
          for t in edge_logs postgres_logs postgrest_logs function_edge_logs function_logs auth_logs realtime_logs storage_logs supavisor_logs; do
            n=$(q "select count(*) as n from $t" | jq -r '.result[0].n // ("error: " + ((.error // "?")|tostring))' 2>/dev/null || echo "error")
            printf '  %-20s %s\n' "$t" "$n"
          done
          echo "== B · busiest API paths (edge_logs, query strings dropped, ids masked)"
          q "select regexp_replace(r.path, r'[0-9a-f-]{8,}|[0-9]+', ':id') as p, r.method as m, count(*) as n from edge_logs cross join unnest(metadata) as md cross join unnest(md.request) as r group by p, m order by n desc limit 30" \
            | jq -r '.result[]? | "  \(.n)\t\(.m) \(.p)"'
          echo "== C · busiest edge functions"
          q "select regexp_replace(r.pathname, r'[0-9a-f-]{8,}|[0-9]+', ':id') as p, count(*) as n from function_edge_logs cross join unnest(metadata) as md cross join unnest(md.request) as r group by p order by n desc limit 15" \
            | jq -r '.result[]? | "  \(.n)\t\(.p)"'
          echo "== D · database log message kinds (first 60 letters, digits masked)"
          q "select regexp_replace(substr(event_message, 1, 60), r'[0-9]+', '#') as k, count(*) as n from postgres_logs where not regexp_contains(lower(event_message), r'password|secret|token|apikey|api_key|jwt|bearer|key=') group by k order by n desc limit 20" \
            | jq -r '.result[]? | "  \(.n)\t\(.k)"'
          echo "Read only: nothing was changed."
