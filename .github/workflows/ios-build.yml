name: iOS Build

# 50mm Retina World — iOS build, sign, and TestFlight upload.
#
# This is the iOS counterpart to android-build.yml. It builds the same React
# web bundle (dist/), wraps it in a fresh Capacitor iOS project, signs it with
# the Distribution Certificate + App Store provisioning profile, and uploads
# the resulting .ipa to TestFlight via the App Store Connect API.
#
# Required secrets (Settings -> Secrets and variables -> Actions):
#   BUILD_CERTIFICATE_BASE64        - distribution.p12, base64-encoded
#   BUILD_CERTIFICATE_PASSWORD      - export password for the .p12
#   BUILD_PROVISION_PROFILE_BASE64  - App Store provisioning profile, base64-encoded
#   APP_STORE_KEY_ID                - App Store Connect API Key ID
#   APP_STORE_ISSUER_ID             - App Store Connect API Issuer ID
#   APP_STORE_KEY_BASE64            - App Store Connect API private key (.p8), base64-encoded
#
# Bundle ID: com.fiftymmretina.app (must match capacitor.config.ts appId and
# the App ID used to generate the provisioning profile).
#
# SCOPE (parity with Android, Owner 22-23 Nov 2026): share, filesystem, camera, app, browser, splash-screen,
# app-update (App Store check + open the App Store page) and - when GoogleService-Info.plist is committed at the
# repo root - Firebase push (@capacitor-firebase/messaging, step "Wire push into the iOS project").
# Apple-side setup runs through the App Store Connect API with the saved key (tools/ios/asc-setup.mjs): the Apple
# ID, the Push capability on the App ID, and the App Store profile. Two things have no API and stay manual: the
# APNs key itself (developer.apple.com → Keys) and uploading it to Firebase (Cloud Messaging settings).
# testflight_upload=false builds and signs without uploading (a compile check).
#
# NODE 22, NOT 20 - matches android-build.yml. @capacitor/cli 8.5.0 requires it.
#
# TOOLCHAIN: Xcode 27 ONLY (Owner order 27 Nov 2026, docs/IOS_APP_STORE_RULES.md rule B1).
#
# Trigger: manual only (workflow_dispatch) until a first build is verified
# end-to-end. Once a build lands cleanly in TestFlight, uncomment the `push`
# trigger below to build iOS automatically on every push to main, same as
# Android does.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "App Store version (CFBundleShortVersionString). A version Apple already released cannot take a new binary - raise it for every new release."
        required: false
        default: "1.2"
      testflight_upload:
        description: "Upload the signed build to TestFlight. Off = build + sign only (a compile check; nothing reaches Apple)."
        type: boolean
        required: false
        default: true
      notification_photo:
        description: "Sender's round photo on message notifications (a notification service extension). Off = build without it, if it ever blocks a release."
        type: boolean
        required: false
        default: true
  # push:
  #   branches: [main]

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    # XCODE 27 ONLY (Owner order 27 Nov 2026; Apple notice 90725). No fallback to Xcode 26 and no machine choice:
    # docs/IOS_APP_STORE_RULES.md rule B1, held by src/__tests__/iosXcode27Rule.test.ts. Xcode 27 runs on Apple
    # silicon only; the xcode-27 label is GitHub's image for it (probe run 45922307810, build 45922410650).
    # Never move below Swift 6.2: Capacitor 8.5.0's prebuilt iOS runtime hides its plugin API from older compilers.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.fiftymmretina.app
      NOTIFICATION_PHOTO: ${{ inputs.notification_photo != false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # PUSH SWITCH + APPLE ID. Push (Firebase Cloud Messaging, same plugin as Android) is wired in ONLY when the
      # iPhone Firebase file GoogleService-Info.plist is committed at the repo root (Android's google-services.json
      # sits beside it). Firebase also needs the APNs key uploaded in its console (Owner step, no API for that).
      # The Apple ID (for the App Store "Update available" prompt) is read from App Store Connect with the saved key.
      - name: Push switch + Apple ID (App Store Connect API)
        id: apple
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_BASE64: ${{ secrets.APP_STORE_KEY_BASE64 }}
          FALLBACK_APP_STORE_ID: ${{ vars.IOS_APP_STORE_ID }}
        run: |
          set -euo pipefail
          if [ -f GoogleService-Info.plist ]; then
            GOT=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" GoogleService-Info.plist 2>/dev/null || true)
            if [ "$GOT" != "$BUNDLE_ID" ]; then
              echo "::error::GoogleService-Info.plist is for bundle '$GOT', this app is '$BUNDLE_ID'. Download the iOS app's file from Firebase again."
              exit 1
            fi
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "Push: ON (GoogleService-Info.plist for $GOT)"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "Push: OFF (no GoogleService-Info.plist at the repo root)"
          fi
          export ASC_KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"
          echo -n "$APP_STORE_KEY_BASE64" | base64 --decode -o "$ASC_KEY_PATH"
          ID=$(node tools/ios/asc-setup.mjs app-id || true)
          [ -n "$ID" ] || ID="${FALLBACK_APP_STORE_ID:-}"
          echo "Apple ID for the App Store page: ${ID:-<none - update prompt stays off on iOS>}"
          echo "app_store_id=$ID" >> "$GITHUB_OUTPUT"
          echo "asc_key_path=$ASC_KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: App Store review compliance gate (docs/IOS_APP_STORE_RULES.md)
        run: npx vitest run src/__tests__/appStoreReviewCompliance.test.ts src/components/__tests__/AppleIosNoTracking.test.tsx

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: https://jtdtehuqtinjxropkkcn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0ZHRlaHVxdGluanhyb3Bra2NuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NzI3MjEsImV4cCI6MjA5OTE0ODcyMX0.qY8BI5LXb6uLzTwbpf8AleZ6UZyfeaOA0q4_TC5CEpo
          VITE_SUPABASE_PROJECT_ID: jtdtehuqtinjxropkkcn
          # iOS "Update available" prompt opens the App Store page, which needs the numeric Apple ID — read from
          # App Store Connect in the step above (repo variable IOS_APP_STORE_ID as fallback). Empty → prompt off on iOS.
          VITE_IOS_APP_STORE_ID: ${{ steps.apple.outputs.app_store_id }}
        run: npm run build

      - name: Install Capacitor + iOS-safe native plugins (pinned)
        run: |
          # Parity with Android (Owner 22 Nov 2026: fill the gaps before the next iOS app):
          #  - @capacitor/splash-screen@8.0.2 is back. It was left out only to keep the Swift 6.2 toolchain fix
          #    (macos-15 / Xcode 26) a single variable; its old compile errors were that same Swift gate, not
          #    a plugin incompatibility. Same version as android-build.yml.
          #  - @capawesome/capacitor-app-update@8.0.3 (same as Android): on iOS it only CHECKS the App Store
          #    version and opens the App Store page (no in-app install on iOS) - see src/lib/native/appUpdate.ts.
          #  - @capacitor-firebase/messaging@8.4.0 (same as Android) only when the push switch is ON (step "apple").
          #    It starts Firebase itself (FirebaseApp.configure) and registers with APNs; the token hand-off lines
          #    go into AppDelegate.swift in "Wire push into the iOS project" below.
          PUSH_PLUGIN=""
          if [ "${{ steps.apple.outputs.push }}" = "true" ]; then PUSH_PLUGIN="@capacitor-firebase/messaging@8.4.0"; fi
          #  - @capacitor/keyboard@8.0.6 (iPhone only, Owner bug list item 2): with capacitor.config.ts
          #    Keyboard.resize = 'native' the app's screen shrinks above the keyboard, so a comment box or the
          #    Sign in form is no longer slid up behind the clock.
          npm install --no-audit --no-fund \
            @capacitor/core@8.5.0 @capacitor/cli@8.5.0 @capacitor/ios@8.5.0 \
            @capacitor/share@8.0.1 @capacitor/splash-screen@8.0.2 \
            @capacitor/filesystem@8.1.2 @capacitor/camera@8.2.2 \
            @capacitor/app@8.1.1 @capacitor/browser@8.0.4 \
            @capacitor/keyboard@8.0.6 \
            @capawesome/capacitor-app-update@8.0.3 $PUSH_PLUGIN

      - name: Add iOS platform
        run: npx cap add ios

      - name: Generate app icon and splash screens from resources/
        run: |
          set -euo pipefail
          # WHY THIS EXISTS: `cap add ios` scaffolds Capacitor's DEFAULT
          # placeholder icon. Nothing replaced it, so builds 1-16 shipped that
          # placeholder instead of the real logo - App Store Connect showed it
          # as the app icon, because Apple takes the icon from the binary and
          # there is nowhere to upload one by hand. android-build.yml has run
          # `capacitor-assets generate --android` all along; the iOS workflow
          # simply never had the equivalent step.
          #
          # resources/icon.png is 1024x1024 RGB with no alpha channel, which is
          # what the App Store requires (an alpha channel in the marketing icon
          # is an automatic rejection).
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          BEFORE=$(find "$ICONSET" -name '*.png' -exec shasum -a 256 {} + 2>/dev/null | shasum -a 256 | awk '{print $1}')
          echo "Placeholder iconset checksum: $BEFORE"

          npm install --no-audit --no-fund -D @capacitor/assets@3.0.5
          npx capacitor-assets generate --ios \
            --iconBackgroundColor '#0f172a' --splashBackgroundColor '#0f172a'

          AFTER=$(find "$ICONSET" -name '*.png' -exec shasum -a 256 {} + 2>/dev/null | shasum -a 256 | awk '{print $1}')
          echo "Generated iconset checksum:   $AFTER"

          # GUARD: no `|| true` here on purpose. If generation silently no-ops,
          # the build must fail loudly rather than ship the placeholder again.
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "::error::capacitor-assets did not change the app icons - the placeholder icon is still in place. Check that resources/icon.png exists and is readable."
            exit 1
          fi

          # GUARD: the marketing icon must be exactly 1024x1024 and have no
          # alpha channel, or App Store Connect rejects the binary.
          BIG=$(find "$ICONSET" -name '*.png' -exec sh -c 'echo "$(sips -g pixelWidth "$1" | awk "/pixelWidth/{print \$2}") $1"' _ {} \; | sort -rn | head -1 | cut -d' ' -f2-)
          echo "Largest generated icon: $BIG"
          W=$(sips -g pixelWidth "$BIG" | awk '/pixelWidth/{print $2}')
          H=$(sips -g pixelHeight "$BIG" | awk '/pixelHeight/{print $2}')
          A=$(sips -g hasAlpha "$BIG" | awk '/hasAlpha/{print $2}')
          echo "Marketing icon: ${W}x${H}, hasAlpha=${A}"
          if [ "$W" != "1024" ] || [ "$H" != "1024" ]; then
            echo "::error::Marketing icon is ${W}x${H}, expected 1024x1024."
            exit 1
          fi
          if [ "$A" = "yes" ]; then
            echo "::error::Marketing icon has an alpha channel. Apple rejects this. Flatten resources/icon.png onto an opaque background."
            exit 1
          fi

      - name: Sync web assets into iOS project
        run: npx cap sync ios

      - name: Verify synced assets exist
        id: verify
        run: |
          set -euo pipefail
          PUB="ios/App/App/public"
          test -f "$PUB/index.html" || { echo "::error::No synced web assets at $PUB - cap sync did not run?"; exit 1; }

          # Capacitor 8+ integrates iOS native deps via Swift Package Manager by
          # default (writes Package.swift, no CocoaPods `pod install`), so no
          # CocoaPods-generated App.xcworkspace exists - only App.xcodeproj.
          # Detect whichever container cap sync actually produced so Archive
          # stays correct whether SPM or CocoaPods integration is in use.
          if [ -d "ios/App/App.xcworkspace" ]; then
            echo "container_flag=-workspace" >> "$GITHUB_OUTPUT"
            echo "container_path=ios/App/App.xcworkspace" >> "$GITHUB_OUTPUT"
          elif [ -d "ios/App/App.xcodeproj" ]; then
            echo "container_flag=-project" >> "$GITHUB_OUTPUT"
            echo "container_path=ios/App/App.xcodeproj" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither ios/App/App.xcworkspace nor ios/App/App.xcodeproj exists after cap sync"
            exit 1
          fi

      - name: Add privacy purpose strings and build number to Info.plist
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version || '1.2' }}
        run: |
          set -euo pipefail
          # Apple rejected build #15 AFTER upload with:
          #   90683: Missing purpose string in Info.plist ...
          #   should contain a NSPhotoLibraryUsageDescription key
          #
          # @capacitor/camera links the photo library and camera APIs, and iOS
          # requires a user-facing purpose string for each one. Capacitor does
          # NOT generate them - they are the app's responsibility - and ios/ is
          # regenerated by `cap add ios` every run, so they must be written
          # here rather than committed.
          #
          # All three camera-related keys are set, not just the one Apple named:
          # the plugin references reading the library, saving to it, and the
          # camera itself, and a missing string is a hard upload rejection.
          # These strings are user-facing and are read by App Review, so they
          # state specifically what the app does with each permission.
          PLIST="ios/App/App/Info.plist"
          test -f "$PLIST" || { echo "::error::$PLIST not found after cap sync"; exit 1; }

          add_or_set() {
            if /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"
            fi
          }

          add_or_set NSCameraUsageDescription "50mm Retina World uses the camera so you can take a photo to enter a competition, add to a post, or update your profile picture."
          add_or_set NSPhotoLibraryUsageDescription "50mm Retina World needs access to your photo library so you can choose existing photos to enter competitions, add to posts, or set your profile picture."
          add_or_set NSPhotoLibraryAddUsageDescription "50mm Retina World saves images to your photo library when you download a photo or a certificate you have earned."

          # BUILD NUMBER. Apple refuses an upload whose build number was already
          # delivered, and build "1" was consumed by the rejected build #15
          # delivery. Capacitor's generated Info.plist hardcodes CFBundleVersion
          # to 1, so every run would collide from here on. github.run_number is
          # unique and monotonically increasing, which is exactly what Apple
          # requires, so this can never clash again.
          add_or_set CFBundleVersion "$BUILD_NUMBER"
          add_or_set CFBundleShortVersionString "$MARKETING_VERSION"
          # EXPORT COMPLIANCE. Without this key every upload stops in TestFlight
          # at "Missing Compliance" until someone answers by hand, and testers
          # never see the build (build 19, 2026-10-03). The app uses only the
          # encryption built into iOS (HTTPS), which is exempt, so the answer is
          # always "no non-exempt encryption".
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          # STATUS BAR TEXT (Owner 26 Nov 2026): the app now draws a plain dark strip behind the time and battery
          # (src/index.css "THE PHONE'S OWN STATUS BAR"), so iOS must draw them WHITE - also on a phone set to light
          # mode, where it would otherwise draw them black on the dark strip. One app-wide setting (no plugin).
          add_or_set UIStatusBarStyle UIStatusBarStyleLightContent
          /usr/libexec/PlistBuddy -c "Delete :UIViewControllerBasedStatusBarAppearance" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST"

          echo "Purpose strings now in Info.plist:"
          for KEY in NSCameraUsageDescription NSPhotoLibraryUsageDescription NSPhotoLibraryAddUsageDescription; do
            VALUE=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" 2>/dev/null || true)
            if [ -z "$VALUE" ]; then
              echo "::error::$KEY missing from Info.plist after patching."
              exit 1
            fi
            echo "  $KEY = $VALUE"
          done
          echo "CFBundleShortVersionString = $(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")"
          echo "CFBundleVersion (build number) = $(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")"

      - name: Wire push into the iOS project
        if: steps.apple.outputs.push == 'true'
        run: |
          set -euo pipefail
          # ios/ is regenerated every run, so each piece is written here (same reason as the Info.plist step above).
          # 1. Firebase config file, inside the App target's bundle resources.
          cp GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          if ! ruby -e 'require "xcodeproj"' 2>/dev/null; then sudo gem install xcodeproj --no-document; fi
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" } or abort("::error::No App target")
            group = project.main_group.find_subpath("App", false) or abort("::error::No App group")
            ref = group.files.find { |f| f.path == "GoogleService-Info.plist" } || group.new_reference("GoogleService-Info.plist")
            target.resources_build_phase.add_file_reference(ref, true)
            project.save
            ok = target.resources_build_phase.files_references.any? { |r| r && r.path == "GoogleService-Info.plist" }
            abort("::error::GoogleService-Info.plist is not in the App target resources") unless ok
            puts "GoogleService-Info.plist added to App target resources."
          '
          # 2. Push entitlement (App Store builds use the production APNs environment). Set on the App target in
          #    "Configure manual signing" (CODE_SIGN_ENTITLEMENTS); the profile from App Store Connect carries it too.
          cat > ios/App/App/App.entitlements <<'ENT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          ENT
          plutil -lint ios/App/App/App.entitlements
          # 3. Background mode "remote-notification" (the plugin's setup asks for it).
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" >/dev/null 2>&1 || /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          if ! /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST" | grep -q "remote-notification"; then
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$PLIST"
          fi
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
          # 4. AppDelegate: hand the APNs token (and silent pushes) to the plugin — the three methods from the
          #    @capacitor-firebase/messaging README, added once before the class's closing brace.
          ruby -e '
            path = "ios/App/App/AppDelegate.swift"
            src = File.read(path)
            if src.include?("capacitorDidRegisterForRemoteNotifications")
              puts "AppDelegate already forwards push tokens."
              exit 0
            end
            add = <<~SWIFT

              // Push (Firebase Cloud Messaging) — added by ios-build.yml "Wire push into the iOS project".
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }

              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }

              func application(_ application: UIApplication, didReceiveRemoteNotification userInfo: [AnyHashable: Any], fetchCompletionHandler completionHandler: @escaping (UIBackgroundFetchResult) -> Void) {
                  NotificationCenter.default.post(name: Notification.Name.init("didReceiveRemoteNotification"), object: completionHandler, userInfo: userInfo)
              }
            SWIFT
            idx = src.rindex("}") or abort("::error::AppDelegate.swift has no closing brace")
            File.write(path, src[0...idx] + add.gsub(/^/, "    ") + "\n}\n")
            puts "AppDelegate.swift: push token forwarding added."
          '
          grep -c "capacitorDidRegisterForRemoteNotifications" ios/App/App/AppDelegate.swift

      # The picture on a notification (the sender's round photo on a message): a notification service extension,
      # added to the regenerated project the same way as the pieces above.
      - name: Add the notification photo extension
        if: steps.apple.outputs.push == 'true' && env.NOTIFICATION_PHOTO == 'true'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          MARKETING_VERSION: ${{ inputs.marketing_version || '1.2' }}
        run: |
          set -euo pipefail
          ruby tools/ios/add-notification-service.rb

      - name: Import Distribution Certificate + Provisioning Profile
        id: cert
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          echo "DEBUG: cert file size=$(wc -c < "$CERT_PATH") sha256=$(shasum -a 256 "$CERT_PATH" | awk '{print $1}')"
          echo "DEBUG: profile file size=$(wc -c < "$PROFILE_PATH") sha256=$(shasum -a 256 "$PROFILE_PATH" | awk '{print $1}')"
          echo "DEBUG: password length=${#BUILD_CERTIFICATE_PASSWORD}"
          echo "DEBUG: base64 secret length=${#BUILD_CERTIFICATE_BASE64}"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$BUILD_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          # GUARD: prove the identity is actually usable for code signing before
          # spending four minutes building. Importing a .p12 can succeed while
          # leaving no usable identity (wrong password, cert without its private
          # key, key not in the partition list). Until now nothing verified
          # this, because every build so far either skipped signing or used
          # cloud signing - so a broken identity would only have surfaced as a
          # confusing failure much later.
          echo "Code signing identities in build keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Accept either naming. Apple renamed the distribution certificate
          # type from "iPhone Distribution" to "Apple Distribution"; both are
          # valid for App Store submission, and hard-coding one would reject a
          # perfectly good certificate.
          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true)
          if echo "$IDENTITIES" | grep -q "Apple Distribution"; then
            SIGN_IDENTITY="Apple Distribution"
          elif echo "$IDENTITIES" | grep -q "iPhone Distribution"; then
            SIGN_IDENTITY="iPhone Distribution"
          else
            echo "::error::No distribution code signing identity in the keychain after importing BUILD_CERTIFICATE_BASE64. The .p12 must contain an 'Apple Distribution' (or legacy 'iPhone Distribution') certificate AND its private key, and BUILD_CERTIFICATE_PASSWORD must match. Identities found above."
            exit 1
          fi
          echo "Using signing identity: $SIGN_IDENTITY"
          echo "sign_identity=$SIGN_IDENTITY" >> "$GITHUB_OUTPUT"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # The App Store profile is made by App Store Connect itself (tools/ios/asc-setup.mjs) for THIS certificate,
      # with Push turned on for the App ID when the push switch is ON — no hand-made profile to download and paste.
      # Push ON: this must succeed. Push OFF: if Apple refuses, the saved BUILD_PROVISION_PROFILE_BASE64 is used as before.
      - name: App Store profile from App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          ASC_KEY_PATH: ${{ steps.apple.outputs.asc_key_path }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          PUSH: ${{ steps.apple.outputs.push }}
        run: |
          set -uo pipefail
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          serial() { openssl pkcs12 -in "$CERT_PATH" -nokeys -clcerts -passin env:BUILD_CERTIFICATE_PASSWORD "$@" 2>/dev/null | openssl x509 -noout -serial 2>/dev/null; }
          SERIAL=$(serial || true); [ -n "$SERIAL" ] || SERIAL=$(serial -legacy || true)
          if [ -z "$SERIAL" ]; then
            if [ "$PUSH" = "true" ]; then echo "::error::Could not read the Distribution certificate serial"; exit 1; fi
            echo "::warning::Could not read the certificate serial - using the saved profile."; exit 0
          fi
          echo "Distribution certificate $SERIAL"
          echo "CERT_SERIAL=$SERIAL" >> "$GITHUB_ENV"
          MODE=""; [ "$PUSH" = "true" ] && MODE="push"
          OUT="$RUNNER_TEMP/asc.mobileprovision"
          if node tools/ios/asc-setup.mjs profile "$SERIAL" "$OUT" $MODE; then
            cp "$OUT" "$RUNNER_TEMP/profile.mobileprovision"
            cp "$OUT" ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
            echo "Using the App Store Connect profile."
          elif [ "$PUSH" = "true" ]; then
            exit 1
          else
            echo "::warning::App Store Connect refused - using the saved BUILD_PROVISION_PROFILE_BASE64 profile."
          fi

      - name: App Store profile for the notification extension
        if: steps.apple.outputs.push == 'true' && env.NOTIFICATION_PHOTO == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          ASC_KEY_PATH: ${{ steps.apple.outputs.asc_key_path }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/nse.mobileprovision"
          BUNDLE_ID="$BUNDLE_ID.notificationservice" node tools/ios/asc-setup.mjs extension-profile "$CERT_SERIAL" "$OUT"
          UUID=$(security cms -D -i "$OUT" | plutil -extract UUID raw -o - -)
          cp "$OUT" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "NSE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Read provisioning profile UUID and Team ID
        id: profile
        env:
          PUSH: ${{ steps.apple.outputs.push }}
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          PLIST=$(security cms -D -i "$PROFILE")
          # `|| true` matters: this step runs under `set -euo pipefail`, and
          # plutil exits non-zero for a key that is absent (Name and
          # application-identifier are both optional in principle). Without it,
          # a missing key aborts the step with no diagnostic at all.
          extract() { echo "$PLIST" | plutil -extract "$1" xml1 -o - - 2>/dev/null | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p' || true; }

          UUID=$(extract UUID)
          TEAM_ID=$(extract TeamIdentifier.0)
          NAME=$(extract Name)
          APP_ID=$(extract Entitlements.application-identifier)

          echo "Profile name : $NAME"
          echo "Profile UUID : $UUID"
          echo "Team ID      : $TEAM_ID"
          echo "App ID       : $APP_ID"

          # GUARD: catch a mismatched or wrong-type profile now, with a clear
          # message, instead of as an opaque signing failure minutes later.
          if [ -z "$UUID" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::Could not read UUID/TeamIdentifier from the provisioning profile. Is BUILD_PROVISION_PROFILE_BASE64 a valid .mobileprovision?"
            exit 1
          fi
          # application-identifier is "<TEAMID>.<bundle id>"; it must match this
          # app (or be a wildcard ending in .*).
          case "$APP_ID" in
            *".$BUNDLE_ID") : ;;
            *".*") echo "Note: wildcard profile in use." ;;
            *)
              echo "::error::Provisioning profile is for '$APP_ID' but this build produces '$BUNDLE_ID'. Upload a profile matching the bundle id."
              exit 1
              ;;
          esac
          # An App Store profile has no ProvisionedDevices key. A development or
          # ad-hoc profile does - and it cannot be used for an App Store export.
          if echo "$PLIST" | plutil -extract ProvisionedDevices xml1 -o - - >/dev/null 2>&1; then
            echo "::error::This profile contains ProvisionedDevices, so it is a Development/Ad Hoc profile. App Store export needs an App Store distribution profile."
            exit 1
          fi

          # GUARD (push): the profile must carry the push entitlement, or Apple strips push from the signed app.
          if [ "$PUSH" = "true" ]; then
            APS=$(extract Entitlements.aps-environment)
            if [ -z "$APS" ]; then
              echo "::error::Push is ON but the provisioning profile has no aps-environment entitlement."
              exit 1
            fi
            echo "Profile push environment: $APS"
          fi

          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pinned, never `latest-stable`. XCODE 27 ONLY - see runs-on above.
          xcode-version: '27.0'

      - name: Prepare App Store Connect API key
        id: asckey
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_KEY_BASE64: ${{ secrets.APP_STORE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # Used by the altool upload at the end, which requires the key in
          # ~/.appstoreconnect/private_keys. Archive and export deliberately do
          # NOT use this key: passing it to xcodebuild enables cloud signing,
          # which is what build #14 failed on.
          KEYDIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEYDIR" ~/.appstoreconnect/private_keys
          KEYPATH="$KEYDIR/AuthKey_${APP_STORE_KEY_ID}.p8"
          echo -n "$APP_STORE_KEY_BASE64" | base64 --decode -o "$KEYPATH"
          cp "$KEYPATH" ~/.appstoreconnect/private_keys/
          echo "key_path=$KEYPATH" >> "$GITHUB_OUTPUT"

      - name: Configure manual signing on the App target only
        env:
          TEAM_ID: ${{ steps.profile.outputs.team_id }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
          SIGN_IDENTITY: ${{ steps.cert.outputs.sign_identity }}
          PUSH: ${{ steps.apple.outputs.push }}
        run: |
          set -euo pipefail
          # THE point of this step: xcodebuild CLI settings (KEY=VALUE) are
          # GLOBAL - they hit every target in the graph, including Capacitor's
          # SPM plugin targets and the embedded IONCameraLib/IONFilesystemLib
          # frameworks. Provisioning profiles are only meaningful on an app
          # bundle, so any global profile setting makes those targets fail with
          # "does not support provisioning profiles". Xcode's xcconfig format
          # has no per-target qualifier either. The supported way to scope a
          # setting to ONE target is to write it into the project file, which
          # is what this does - the App target gets manual signing with the
          # real profile, and every other target is left completely alone to be
          # signed with just the identity, which is correct for frameworks.
          #
          # ios/ is not committed (cap add ios regenerates it every run), so
          # this patch has to happen here in CI, after sync and before archive.
          #
          # xcodeproj ships as a CocoaPods dependency and CocoaPods is
          # preinstalled on the macOS runner image - but it may live under a
          # different ruby than the default `ruby` on PATH, so verify rather
          # than assume, and install it if the require fails.
          if ! ruby -e 'require "xcodeproj"' 2>/dev/null; then
            echo "xcodeproj gem not visible to the default ruby - installing it."
            sudo gem install xcodeproj --no-document
          fi
          ruby -e 'require "xcodeproj"' || { echo "::error::xcodeproj gem unavailable; cannot scope signing to the App target."; exit 1; }

          ruby -e '
            require "xcodeproj"
            path = "ios/App/App.xcodeproj"
            project = Xcodeproj::Project.open(path)
            target = project.targets.find { |t| t.name == "App" }
            abort("::error::No App target found in #{path}") unless target
            target.build_configurations.each do |config|
              config.build_settings["CODE_SIGN_STYLE"] = "Manual"
              config.build_settings["DEVELOPMENT_TEAM"] = ENV["TEAM_ID"]
              config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV["PROFILE_UUID"]
              config.build_settings["CODE_SIGN_IDENTITY"] = ENV["SIGN_IDENTITY"]
              config.build_settings["PRODUCT_BUNDLE_IDENTIFIER"] = ENV["BUNDLE_ID"]
              config.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements" if ENV["PUSH"] == "true"
            end
            ext = project.targets.find { |t| t.name == "NotificationService" }
            if ext
              abort("::error::No profile for the notification extension") if ENV["NSE_UUID"].to_s.empty?
              ext.build_configurations.each do |config|
                config.build_settings["CODE_SIGN_STYLE"] = "Manual"
                config.build_settings["DEVELOPMENT_TEAM"] = ENV["TEAM_ID"]
                config.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV["NSE_UUID"]
                config.build_settings["CODE_SIGN_IDENTITY"] = ENV["SIGN_IDENTITY"]
              end
            end
            project.save
            puts "Signing configured on App target (and its notification extension when present)."
          '

          # GUARD: read the settings back out of the saved project and fail here
          # if they did not stick, rather than discovering it during signing.
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" }
            release = target.build_configurations.find { |c| c.name == "Release" }
            got = release.build_settings
            expected = {
              "CODE_SIGN_STYLE" => "Manual",
              "DEVELOPMENT_TEAM" => ENV["TEAM_ID"],
              "PROVISIONING_PROFILE_SPECIFIER" => ENV["PROFILE_UUID"],
              "PRODUCT_BUNDLE_IDENTIFIER" => ENV["BUNDLE_ID"]
            }
            bad = expected.reject { |k, v| got[k] == v }
            unless bad.empty?
              bad.each { |k, v| STDERR.puts "::error::App target Release setting #{k} is #{got[k].inspect}, expected #{v.inspect}" }
              exit 1
            end
            puts "Verified on App/Release: #{expected.keys.join(", ")}."
            others = project.targets.reject { |t| ["App", "NotificationService"].include?(t.name) }
            leaked = others.select { |t| t.build_configurations.any? { |c| c.build_settings["PROVISIONING_PROFILE_SPECIFIER"] } }
            unless leaked.empty?
              STDERR.puts "::error::Provisioning profile leaked onto non-app targets: #{leaked.map(&:name).join(", ")}"
              exit 1
            end
            puts "Verified no other target carries a provisioning profile."
          '

      - name: Archive
        env:
          CONTAINER_FLAG: ${{ steps.verify.outputs.container_flag }}
          CONTAINER_PATH: ${{ steps.verify.outputs.container_path }}
        run: |
          set -euo pipefail

          # SIGNING MODEL - read this before adding any KEY=VALUE flag here.
          #
          # Deliberately NO signing settings on this command line. All of them
          # are now set on the App target alone by the previous step, because
          # CLI settings are global and Capacitor's SPM plugin targets and the
          # embedded IONCameraLib/IONFilesystemLib frameworks cannot take a
          # provisioning profile. This workflow has already burned three builds
          # learning that, in three different disguises:
          #
          #   #12 and earlier - global PROVISIONING_PROFILE -> archive failed
          #                     with "does not support provisioning profiles".
          #   #13            - archived with CODE_SIGNING_ALLOWED=NO, which
          #                     left the frameworks unsigned, so manual export
          #                     tried to find profiles for them and failed the
          #                     same way one step later.
          #   #14            - switched to automatic/cloud signing, which needs
          #                     the App Store Connect API key to hold signing
          #                     permission it does not have: "Cloud signing
          #                     permission error / No profiles for
          #                     com.fiftymmretina.app were found".
          #
          # The distribution certificate and the App Store profile are already
          # in the keychain from the import step, so no cloud signing and no
          # extra Apple permissions are needed - just point the App target at
          # them, which is exactly what the previous step did.
          xcodebuild "$CONTAINER_FLAG" "$CONTAINER_PATH" \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            clean archive

      - name: Verify push entitlement in the signed app
        if: steps.apple.outputs.push == 'true'
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          ENTS=$(codesign -d --entitlements - --xml "$APP" 2>/dev/null || codesign -d --entitlements :- "$APP" 2>/dev/null || true)
          echo "$ENTS" | grep -q "aps-environment" || { echo "::error::The signed app has no aps-environment entitlement - push would never arrive."; exit 1; }
          test -f "$APP/GoogleService-Info.plist" || { echo "::error::GoogleService-Info.plist is not inside the app bundle."; exit 1; }
          echo "Signed app carries aps-environment and GoogleService-Info.plist."

      - name: Export IPA
        env:
          TEAM_ID: ${{ steps.profile.outputs.team_id }}
          PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
        run: |
          set -euo pipefail
          # Manual signing, matching the archive. The provisioningProfiles dict
          # names ONLY the app bundle id - frameworks are absent on purpose and
          # get signed with the identity inherited from the app. This is safe
          # here (where it was not in build #13) because the archive is now
          # properly signed, so export is re-signing already-signed frameworks
          # rather than having to provision them from scratch.
          #
          # No -allowProvisioningUpdates and no -authenticationKey* flags:
          # those trigger cloud signing, which is what build #14 failed on
          # ("Cloud signing permission error"). Everything needed is already
          # in the keychain.
          # The notification extension (when built) is an app bundle of its own, so it needs its profile too.
          NSE_ENTRY=""
          if [ -n "${NSE_UUID:-}" ]; then NSE_ENTRY="<key>$BUNDLE_ID.notificationservice</key><string>$NSE_UUID</string>"; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_UUID</string>
              $NSE_ENTRY
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.testflight_upload }}
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_KEY_BASE64: ${{ secrets.APP_STORE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          # The key was already written by "Prepare App Store Connect API key"
          # into ~/.appstoreconnect/private_keys, which is where altool looks.

          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -n 1)
          test -n "$IPA_PATH" || { echo "::error::No .ipa produced by Export IPA"; exit 1; }
          echo "Validating: $IPA_PATH"

          # VALIDATE FIRST. This is not optional politeness - build #15 exited
          # 0 here and reported success, while App Store Connect separately
          # marked the upload Failed ("90683: Missing purpose string"). altool
          # --upload-app hands the binary off and returns before Apple finishes
          # checking it, so a green job did not mean a delivered build.
          # --validate-app runs those same checks synchronously, so this class
          # of rejection now fails the workflow loudly instead of silently.
          # altool can print "Failed to validate package" and still EXIT 0 (run 45123070543: train 1.1 closed,
          # yet the step went on to upload). So the output is read too: any validation error stops here.
          VLOG="$RUNNER_TEMP/altool-validate.log"
          set +e
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_KEY_ID" \
            --apiIssuer "$APP_STORE_ISSUER_ID" 2>&1 | tee "$VLOG"
          VCODE=${PIPESTATUS[0]}
          set -e
          if [ "$VCODE" -ne 0 ] || grep -qE "Failed to validate|Validation failed|ERROR: " "$VLOG"; then
            if grep -qE "closed for new build submissions|must contain a higher version" "$VLOG"; then
              echo "::error::Apple refused version $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios/App/App/Info.plist 2>/dev/null || echo '?'): it is already approved/closed. Run again with a higher marketing_version."
            else
              echo "::error::App Store validation failed - nothing was uploaded. See the lines above."
            fi
            exit 1
          fi

          echo "Validation passed. Uploading: $IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_KEY_ID" \
            --apiIssuer "$APP_STORE_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
