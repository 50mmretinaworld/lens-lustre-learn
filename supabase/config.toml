project_id = "jtdtehuqtinjxropkkcn"

[functions]
  [functions.analyze-gallery-image]
    verify_jwt = true
  [functions.ask-anything]
    verify_jwt = false
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.detect-ai-image]
    verify_jwt = false
  # Pinned to the live value (true on both lanes, d1-deploy-functions inventory
  # staging run 43729950922, production run 43730034720, 2026-11-15) so the A3
  # one-delete-program change can deploy. Both are called with the member's /
  # admin's own JWT and pass it on to the database.
  [functions.delete-my-account]
    verify_jwt = true
  [functions.delete-user]
    verify_jwt = true
  # Pinned to the live value (true on staging, d1-deploy-functions inventory
  # run 41454742939, 2026-11-02) so the photo plan U1b orphan-key change can
  # deploy. Called by admins with a user JWT, never by a cron without one.
  [functions.detect-orphan-files]
    verify_jwt = true
  [functions.migrate-storage]
    verify_jwt = false
  [functions.process-email-queue]
    verify_jwt = true
  [functions.s3-upload]
    verify_jwt = false
  # CRITICAL: s3-presign-upload validates the user in code (see index.ts).
  # It MUST stay verify_jwt=false so a transiently stale browser session
  # (e.g. session_not_found / expired refresh) can't gateway-401 every upload.
  # Removing this line silently re-introduces the "Edge Function returned a
  # non-2xx status code" upload outage. Do not delete.
  [functions.s3-presign-upload]
    verify_jwt = false
  [functions.sitemap]
    verify_jwt = false
  # send-push is called by the notify trigger (20260731100000_push_on_notification)
  # with x-internal-secret and NO Authorization header; with verify_jwt=true the
  # gateway would 401 every push. Pinned so d1-deploy-functions.yml can deploy it.
  [functions.send-push]
    verify_jwt = false
  # send-broadcast-push: live is verify_jwt=false (d1-deploy-functions list,
  # production run 43866415718, 16 Nov 2026) — pinned to the live value. The
  # function checks its own callers: an admin JWT (getUser + has admin role), or
  # the job engine's x-internal-secret, which can only release a broadcast an
  # admin already scheduled and that is due (push_broadcast_claim).
  [functions.send-broadcast-push]
    verify_jwt = false
  # message-photo-purge (M19): called only by the job engine with x-internal-secret; no member or visitor token is ever sent.
  [functions.message-photo-purge]
    verify_jwt = false
  [functions.send-transactional-email]
    verify_jwt = true
  [functions.preview-transactional-email]
    verify_jwt = false
  [functions.handle-email-unsubscribe]
    verify_jwt = false
  [functions.handle-email-suppression]
    verify_jwt = false
  [functions.rank-feed]
    verify_jwt = false
  [functions.create-payment-session]
    verify_jwt = false
  [functions.dashboard-init]
    verify_jwt = false
  [functions.s3-delete]
    verify_jwt = false
  [functions.get-payment-gateways-public]
    verify_jwt = false
  [functions.submit-judge-score]
    verify_jwt = false
  [functions.judge-session-resume]
    verify_jwt = false
  [functions.cast-photo-vote]
    verify_jwt = false
  [functions.seo-route-metadata]
    verify_jwt = false
  # READ-ONLY Phase 2 manifest measurement. verify_jwt MUST stay true: the
  # gateway rejecting anonymous callers is the outer of its two auth gates
  # (the inner one is the user_roles admin check in index.ts). It also expires
  # itself on 2026-09-01 so it cannot linger as a media API.
  [functions.measure-post-media]
    verify_jwt = true
  # THE LIVE MEDIA WRITE PATH's verifier. verify_jwt MUST stay false, for the
  # same reason s3-presign-upload does and it is the same failure: this runs on
  # the member's posting path, and a gateway 401 from a transiently stale
  # session would fail the whole post rather than one call. Auth is not
  # weakened by this — the function validates the bearer token with
  # getClaims(), 401s without one, and refuses any media row that is not the
  # caller's own, before it reads a single byte. Removing this line
  # re-introduces the "Edge Function returned a non-2xx status code" posting
  # outage in a new place. Do not delete.
  [functions.media-register-upload]
    verify_jwt = false
  [functions.music-check]
    verify_jwt = true
